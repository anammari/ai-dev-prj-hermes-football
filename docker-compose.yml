# The Compose project. The rules here come from _docs/product-spec.md §4:
#
#   * nothing but `backend` publishes a host port; `docker-compose.dev.yml` adds the db port when a
#     host tool needs it, and is never used by `make up`
#   * no Docker socket is mounted anywhere, in any service
#   * the knowledge corpus is mounted read-only (`:ro`), into the tools that read it
#   * secrets arrive from `.env` at run time; nothing is baked into an image layer
#   * container limits live here, not in Hermes `container_*` settings
#
# The M2 scheduler joins `db` and `ollama`; M3 adds `backend`, the only service with a published host
# port (and the only one that reaches upstream through nobody: it cannot).

name: ${COMPOSE_PROJECT_NAME:-hermes-football}

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - run `make setup`}@db:5432/${POSTGRES_DB:-hermes}
  AGENT_DB_ROLE: ${AGENT_DB_ROLE:-agent_readonly}
  AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
  # The narrow write role behind the dashboard's review button (migration 0004): UPDATE on the two
  # review columns of `agent_turns` only. The agent containers do not receive it.
  AGENT_ADMIN_DB_ROLE: ${AGENT_ADMIN_DB_ROLE:-agent_admin}
  AGENT_ADMIN_DB_PASSWORD: ${AGENT_ADMIN_DB_PASSWORD:-}
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma:300m}
  OLLAMA_EMBED_DIM: ${OLLAMA_EMBED_DIM:-768}
  KNOWLEDGE_DIR: /corpus

x-ollama-image: &ollama-image
  # A CPU-only build of the pinned Ollama. `Dockerfile.ollama` explains it: upstream ships ~3.6 GB
  # of CUDA trees that a container on Apple Silicon can never load, and flattening them away is
  # what returns the space. To go back to stock upstream, replace this block with
  # `image: ollama/ollama:0.40.2`.
  build:
    context: .
    dockerfile: Dockerfile.ollama
  image: hermes-football-ollama:local

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - run `make setup`}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  ollama:
    <<: *ollama-image
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped

  backend:
    build:
      context: .
      target: app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      <<: *app-env
      # No default: an empty token makes every agent-facing request 401 rather than opening the API.
      API_AGENT_TOKEN: ${API_AGENT_TOKEN:?set API_AGENT_TOKEN in .env - run `make setup`}
      # Empty disables the one write path (the review button); it is never an open door.
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      FRESHNESS_MAX_AGE_MINUTES: ${FRESHNESS_MAX_AGE_MINUTES:-1560}
      INGEST_SCHEDULE_HOUR: ${INGEST_SCHEDULE_HOUR:-2}
      INGEST_SCHEDULE_MINUTE: ${INGEST_SCHEDULE_MINUTE:-0}
      INGEST_TIMEZONE: ${INGEST_TIMEZONE:-UTC}
    # The API is the only published port in the stack (_docs/product-spec.md §4). Everything else
    # talks to it over the Compose network by service name.
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./hermes/agent-knowledge:/corpus:ro
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    # The probe hits the one operation the contract marks `security: []`, so a healthy container is
    # also one whose token is misconfigured without the healthcheck failing for the wrong reason.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      target: app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # HTTP-only adapter: no database URL, no owner credentials. It reads the backend API only.
      BACKEND_BASE_URL: http://backend:8000
      API_AGENT_TOKEN: ${API_AGENT_TOKEN:?set API_AGENT_TOKEN in .env - run `make setup`}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      PUBLIC_NOTES_BASE_URL: ${PUBLIC_NOTES_BASE_URL:-}
    command: ["python", "-m", "mcp_server"]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health').read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  hermes:
    build:
      context: .
      target: app
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    environment:
      # The gateway's only write path is the insert-only turn writer below; it holds no database-owner URL.
      API_AGENT_TOKEN: ${API_AGENT_TOKEN:?set API_AGENT_TOKEN in .env - run `make setup`}
      MCP_URL: http://mcp-server:8100/mcp
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      AGENT_TURN_DSN: postgresql+psycopg://${AGENT_DB_WRITER_ROLE:-agent_writer}:${AGENT_DB_WRITER_PASSWORD:-}@db:5432/${POSTGRES_DB:-hermes}
      CHAT_HASH_SALT: ${CHAT_HASH_SALT:-}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-http://host.docker.internal:11434}
      ROUTER_MODEL: ${ROUTER_MODEL:-clef:cloud}
      COMPOSER_BASE_URL: ${COMPOSER_BASE_URL:-http://host.docker.internal:11434}
      COMPOSER_MODEL: ${COMPOSER_MODEL:-beam:cloud}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_ADMIN_USERS: ${TELEGRAM_ADMIN_USERS:-}
      GATEWAY_PORT: "8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hermes/agent-knowledge:/corpus:ro
    command: ["python", "-m", "agent.gateway"]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8200/health').read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  hermes-review:
    profiles: [review]
    image: hermes-football-hermes:latest
    depends_on:
      db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    environment:
      # Separate bot token and an explicit public mode, only while the project is under review.
      API_AGENT_TOKEN: ${API_AGENT_TOKEN:?set API_AGENT_TOKEN in .env - run `make setup`}
      MCP_URL: http://mcp-server:8100/mcp
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      AGENT_TURN_DSN: postgresql+psycopg://${AGENT_DB_WRITER_ROLE:-agent_writer}:${AGENT_DB_WRITER_PASSWORD:-}@db:5432/${POSTGRES_DB:-hermes}
      CHAT_HASH_SALT: ${CHAT_HASH_SALT:-}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-http://host.docker.internal:11434}
      ROUTER_MODEL: ${ROUTER_MODEL:-clef:cloud}
      COMPOSER_BASE_URL: ${COMPOSER_BASE_URL:-http://host.docker.internal:11434}
      COMPOSER_MODEL: ${COMPOSER_MODEL:-beam:cloud}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_REVIEW_BOT_TOKEN:-}
      TELEGRAM_ALLOW_ALL_USERS: "true"
      TELEGRAM_ALLOWED_USERS: ""
      TELEGRAM_ADMIN_USERS: ${TELEGRAM_ADMIN_USERS:-}
      TELEGRAM_MIN_INTERVAL_SECONDS: ${TELEGRAM_REVIEW_MIN_INTERVAL_SECONDS:-5}
      TELEGRAM_MAX_MESSAGE_CHARS: ${TELEGRAM_REVIEW_MAX_MESSAGE_CHARS:-500}
      GATEWAY_PORT: "8201"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hermes/agent-knowledge:/corpus:ro
    command: ["python", "-m", "agent.gateway"]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8201/health').read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  ingest:
    build:
      context: .
      target: app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      <<: *app-env
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.football-data.org/v4}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      INGEST_SCHEDULE_HOUR: ${INGEST_SCHEDULE_HOUR:-2}
      INGEST_SCHEDULE_MINUTE: ${INGEST_SCHEDULE_MINUTE:-0}
      INGEST_TIMEZONE: ${INGEST_TIMEZONE:-UTC}
      RAW_PAYLOAD_RETENTION_DAYS: ${RAW_PAYLOAD_RETENTION_DAYS:-30}
    volumes:
      - ./hermes/agent-knowledge:/corpus:ro
    command: ["python", "-m", "ingest", "schedule"]
    mem_limit: 512m
    cpus: 1

  # ---------------------------------------------------------------------------------------------
  # Tools. On demand, never started by `make up`: `make models`, `make migrate`, `make test`, ...
  # ---------------------------------------------------------------------------------------------

  models:
    <<: *ollama-image
    profiles: [tools]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_EMBED_MODEL:-embeddinggemma:300m}"]

  migrate:
    profiles: [tools]
    build:
      context: .
      target: app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      AGENT_DB_WRITER_ROLE: ${AGENT_DB_WRITER_ROLE:-agent_writer}
      AGENT_DB_WRITER_PASSWORD: ${AGENT_DB_WRITER_PASSWORD:-}
      AGENT_ADMIN_DB_ROLE: ${AGENT_ADMIN_DB_ROLE:-agent_admin}
      AGENT_ADMIN_DB_PASSWORD: ${AGENT_ADMIN_DB_PASSWORD:-}
    volumes:
      - ./hermes/agent-knowledge:/corpus:ro
    command: ["alembic", "upgrade", "head"]

  tests:
    profiles: [tools]
    build:
      context: .
      target: app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      # The integration suite logs into the API it is testing, so this container needs the same token
      # the `backend` service is given. Empty by default: Compose already fails loudly when the token
      # for the API itself is unset, and the suite says so rather than testing an open service.
      API_AGENT_TOKEN: ${API_AGENT_TOKEN:-}
      # The admin integration test exercises the one write through the same token the dashboard uses;
      # empty means the test is skipped rather than failing for the wrong reason.
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:-}
      AGENT_DB_WRITER_ROLE: ${AGENT_DB_WRITER_ROLE:-agent_writer}
      AGENT_DB_WRITER_PASSWORD: ${AGENT_DB_WRITER_PASSWORD:-}
      AGENT_TURN_DSN: postgresql+psycopg://${AGENT_DB_WRITER_ROLE:-agent_writer}:${AGENT_DB_WRITER_PASSWORD:-}@db:5432/${POSTGRES_DB:-hermes}
      CHAT_HASH_SALT: ${CHAT_HASH_SALT:-test-salt}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-http://host.docker.internal:11434}
      COMPOSER_BASE_URL: ${COMPOSER_BASE_URL:-http://host.docker.internal:11434}
      COMPOSER_MODEL: ${COMPOSER_MODEL:-beam:cloud}
      MCP_URL: http://mcp-server:8100/mcp
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hermes/agent-knowledge:/corpus:ro
    command: ["pytest", "-q", "-m", "not integration"]

volumes:
  pgdata:
  ollama-data:
