name: ci

# What runs here, and what cannot:
#
#   * everything that needs only Python, Node or Postgres runs on a GitHub runner;
#   * the integration job runs the real Postgres + pgvector and a real embedding model, but not the
#     gateway suite: that one calls `clef:cloud`, the signed-off cloud router, and a GitHub runner has
#     no signed-in Ollama and no business receiving project prompts;
#   * `make eval` is never a CI job for the same reason. It is a local gate, recorded in the PR body.
#
# There are no repository secrets in this workflow. The database passwords are throwaway values, the
# API tokens are literals that exist only in this file, and no upstream, Telegram or cloud credential
# is available to a pull_request job.

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs so the main-only e2e job can be exercised on a branch before it is merged.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: OpenAPI contract
        run: npx --yes @redocly/cli lint openapi.yaml
      - name: Workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (contract drift included)
        run: pytest -q -m "not integration"
      - name: Eval gate self-check
        run: python -m evals.golden.runner --self-check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: API types are current
        working-directory: frontend
        run: pnpm check:api

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Secret scan
        run: |
          mkdir -p security/scans/ci
          docker run --rm -v "$PWD:/repo" -w /repo -e HOME=/tmp \
            ghcr.io/gitleaks/gitleaks:v8.24.0 detect \
            --source=/repo --no-git --redact --config=/repo/.gitleaks.toml \
            --report-format=json --report-path=/repo/security/scans/ci/gitleaks.json
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
          pip-audit --progress-spinner off
      - name: Frontend dependency audit
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - name: Filesystem scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.58.1 fs \
            --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs frontend/node_modules --skip-dirs .git /repo

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: hermes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://hermes:ci-postgres@127.0.0.1:5432/hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ci-postgres
      POSTGRES_DB: hermes
      AGENT_DB_ROLE: agent_readonly
      AGENT_DB_PASSWORD: ci-agent
      AGENT_DB_WRITER_ROLE: agent_writer
      AGENT_DB_WRITER_PASSWORD: ci-writer
      AGENT_ADMIN_DB_ROLE: agent_admin
      AGENT_ADMIN_DB_PASSWORD: ci-admin
      API_AGENT_TOKEN: ci-agent-token
      API_ADMIN_TOKEN: ci-admin-token
      CHAT_HASH_SALT: ci-salt
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_EMBED_MODEL: embeddinggemma:300m
      OLLAMA_EMBED_DIM: "768"
      BACKEND_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-embeddinggemma-300m-v1
      - name: Start the local embedding model
        run: |
          mkdir -p "$HOME/.ollama"
          docker run -d --name ollama -p 11434:11434 -v "$HOME/.ollama:/root/.ollama" ollama/ollama:0.40.2
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull embeddinggemma:300m
      - name: Migrate
        run: alembic upgrade head
      - name: Start the API the live tests read
        run: |
          uvicorn backend.app:app --host 127.0.0.1 --port 8000 --no-access-log &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
      - name: Integration suite (gateway/router test excluded)
        run: pytest -q -m "integration and not router"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -t hermes-football-app:ci .
      - name: Build the dashboard image
        run: docker build -f frontend/Dockerfile -t hermes-football-frontend:ci .

  e2e:
    name: e2e (main only)
    # The browser suite needs rows to look at. It runs on a push to main and on a deliberate manual
    # dispatch (used to prove a fix on a branch); pull requests keep the fast gates only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure the throwaway stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' .env
          sed -i 's/^API_AGENT_TOKEN=.*/API_AGENT_TOKEN=ci-agent-token/' .env
          sed -i 's/^API_ADMIN_TOKEN=.*/API_ADMIN_TOKEN=ci-admin-token/' .env
          sed -i 's/^CHAT_HASH_SALT=.*/CHAT_HASH_SALT=ci-salt/' .env
      - name: Build the images this job needs
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build backend frontend migrate
      - name: Start the database and the embedding model
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait db ollama
      - name: Migrate the throwaway database
        # A fresh Postgres has no schema, and /health answers 200 while it is missing, so without this
        # step the dashboard starts and every page renders its error panel.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile tools run --rm -T migrate
      - name: Seed the sample world the browser specs read
        # The suite's own fixture, so the rows the specs assert on are the rows the API tests use. This
        # replaces the live data `make e2e` reads from the owner's stack; no upstream call, no secret.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile tools run --rm -T migrate python - <<'PY'
          from db.session import create_db_engine, create_session_factory, session_scope
          from db.settings import Settings
          from tests.api_helpers import seed_api

          engine = create_db_engine(Settings.from_env())
          with session_scope(create_session_factory(engine)) as session:
              seed_api(session)
          PY
      - name: Start the API and the dashboard
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait backend frontend
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then break; fi
            sleep 2
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and run the browser suite
        working-directory: frontend
        env:
          DASHBOARD_URL: http://127.0.0.1:3000
          API_AGENT_TOKEN: ci-agent-token
          API_ADMIN_TOKEN: ci-admin-token
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

  ci:
    name: ci
    if: always()
    needs: [lint, unit, frontend, security, integration, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every required gate passed
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} frontend=${{ needs.frontend.result }} security=${{ needs.security.result }} integration=${{ needs.integration.result }} build=${{ needs.build.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.build.result }}" = success
