name: nightly

# Dependency drift and the one scan that needs history. No project data and no prompts: this workflow
# reads manifests, lockfiles and the git tree only. The eval and the router suite are deliberately
# absent - both need the signed-off cloud models and are local owner-run gates.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full-history secret scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e HOME=/tmp \
            ghcr.io/gitleaks/gitleaks:v8.24.0 detect \
            --source=/repo --redact --config=/repo/.gitleaks.toml \
            --report-format=json --report-path=/dev/stdout > gitleaks-history.json
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
          pip-audit --progress-spinner off
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Frontend dependency audit
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit
          path: gitleaks-history.json
          if-no-files-found: ignore
