# The compiled list of the notes the bot is allowed to quote.
#
# The Markdown files are the source of truth; this file is the inventory, and the build fails if the
# two disagree (`R-F6.5`, `_docs/decisions/0001`). Every note repeats these keys as YAML
# front-matter, and `python -m ingest.knowledge check` verifies that the two copies agree.
#
# question_classes are the seven classes of `_docs/scoping.md` §4:
#   formats, tiebreakers, qualification_relegation, data_policy, coverage_limits, glossary, multi_hop
#
# status is draft, reviewed or retired. Drafts ARE indexed, so the pipeline can be exercised before
# the corpus is finished; M4 turns them into reviewed notes one at a time. A retired note keeps its
# entry (with its history) and is removed from the index.

version: 1

notes:
