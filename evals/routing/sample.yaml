# The M3b routing sample: 85 hand-labelled questions.
#
# 17 classes x 5. Thirty-five of the 85 are stored-fact shapes (7 classes), thirty-five are rules/policy
# shapes (7 classes), and fifteen are gate questions (clarify, refuse, adversarial). Of the 70 answerable
# questions the split is exactly 35 database / 35 notes. Every class keeps 2 questions in `dev` and 3
# in `holdout`, so per-class accuracy is measurable on both sides.
#
# The 34 dev questions were written by the harness author. The 51 holdout questions were written by an
# independent reviewer from the class list, after the routing request was committed; that reviewer did
# not see the implementation or the dev questions. The author reviewed the labels, then froze the file.
#
# Labels are route + expected tool + one-line rationale. `tool: null` means either the route is not
# `tool`, or the tool surface has no tool for it (`scorers`, recorded as a gap in decision 0003).
# No message names the expected surface.
#
# The file is data, not prose: `tests/test_router_spike.py` checks it, and the holdout is not run
# through the rules before the final run (evals/routing/README.md section 5).

