      - "top eight go straight to the round of 16"
    expected_terms:
      - ["league phase"]
      - ["eight", "8"]
    expected_reason: null
    rationale: "Competition structure is a written format; the standings tool returns one table, not the shape of the competition."
  - id: g-knowledge-tiebreakers-1
