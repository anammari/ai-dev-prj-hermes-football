      - "How the Championship promotion play-offs work"
    expected_facts:
      - "six clubs, 3rd to 8th"
      - "seven matches in the play-offs"
      - "final at Wembley"
    expected_terms:
      - ["play-off", "playoff", "playoffs"]
      - ["six", "6"]
    expected_reason: null
    rationale: "A fixed format with counts and rounds is written down; a live table cannot say how many clubs contest the play-offs."
  - id: g-knowledge-formats-2
    class: formats
    message: "how many games does each club play in the champions league league phase"
    expected_route: knowledge
    expected_tool: null
    expected_notes:
