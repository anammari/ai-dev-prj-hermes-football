  # ---------------------------------------------------------------------------
  # knowledge (16): all 13 notes at least once, plus 3 two-note questions that
  # pair multi_hop/fifth-place-and-cup-winner.md with one specific note.
  # ---------------------------------------------------------------------------
  - id: g-knowledge-formats-1
    class: formats
    message: "how many teams are in the championship playoffs this season"
    expected_route: knowledge
    expected_tool: null
    expected_notes:
      - formats/championship-playoffs.md
