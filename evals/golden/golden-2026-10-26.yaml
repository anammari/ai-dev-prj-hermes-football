version: 1
created: '2026-10-26'
author: independent-reviewer
questions:
  # ---------------------------------------------------------------------------
  # tool (16): standings x3, fixtures, results, form, head_to_head, scorers x3,
  # freshness — every message names a club or competition and asks for a stored
  # number, date, score, table row or run stamp.
  # ---------------------------------------------------------------------------
  - id: g-tool-standings-1
    class: standings
    message: "where are arsenal in the table"
    expected_route: tool
    expected_tool: get_standings
    expected_notes: []
    expected_headings: []
    expected_facts:
      - "Arsenal's Premier League position"
      - "points and goal difference"
      - "data timestamp"
    expected_terms:
      - ["arsenal"]
    expected_reason: null
    rationale: "A current league position is a stored table row, not a written rule; the tiebreaker note explains ordering but cannot say where a club sits today."
  - id: g-tool-standings-2
    class: standings
    message: "Napoli's points and goal difference in Serie A right now?"
    expected_route: tool
    expected_tool: get_standings
    expected_notes: []
    expected_headings: []
    expected_facts:
      - "Napoli points total"
      - "Napoli goal difference"
      - "Serie A table"
    expected_terms:
      - ["napoli"]
    expected_reason: null
    rationale: "Points and goal difference are columns returned for one club; the neighbouring rules road explains how level clubs are separated, not what the numbers are."
  - id: g-tool-fixtures-1
