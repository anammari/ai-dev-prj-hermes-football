    expected_facts:
      - "goal difference before goals scored"
      - "Rule C.17"
      - "head-to-head only for a decisive place still level"
    expected_terms:
      - ["goal difference"]
      - ["goals scored"]
      - ["head-to-head", "head to head"]
    expected_reason: null
    rationale: "The sorting order is a rule the table tool applies silently; this asks for the reason, which only the note states."
  - id: g-knowledge-tiebreakers-2
    class: tiebreakers
    message: "if two serie a clubs end the season on the same points at the top, how is the title decided"
    expected_route: knowledge
