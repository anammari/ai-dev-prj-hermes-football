[project]
name = "hermes-football"
version = "0.1.0"
description = "Telegram agent that answers football questions, grounded in a local database refreshed daily"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    # The M3 API (backend/). FastAPI validates requests; uvicorn serves them.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# jsonschema is what makes criterion 5's drift test real: every response the API produces is
# validated against the response schema in openapi.yaml, as a test rather than by eye.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db", "ingest", "backend", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: needs the Compose stack (Postgres + pgvector + Ollama); excluded from `make test`",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
